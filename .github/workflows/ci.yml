name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (unit, Spring context, real Docker sandbox)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # contextLoads boots the whole application, which needs a real database
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: codesync
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_PASSWORD: postgres
      # GitHub's Linux runners have Docker, so the real sandbox attack tests run too
      CODESYNC_DOCKER_TESTS: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Pull the sandbox image
        run: docker pull gcc:14

      - name: Run all backend tests
        run: ./mvnw -B test

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build