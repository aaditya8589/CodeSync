# Runs all of CodeSync on one server. Start with:  docker compose up -d --build
# Values come from deploy/.env (copy .env.example).
name: codesync

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: codesync
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codesync"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/codesync
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN in deploy/.env}
      EXECUTION_MAX_CONCURRENT: ${EXECUTION_MAX_CONCURRENT:-4}
    volumes:
      # Lets the backend start sandbox containers on this server. Whoever controls the
      # backend controls Docker, so the backend is not reachable directly: only through Caddy.
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    build:
      context: ../frontend
      args:
        VITE_API_URL: https://${DOMAIN}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
