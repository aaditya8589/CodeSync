spring.application.name=CodeSync Backend

# Every secret and every environment-specific value comes from an environment variable.
# The defaults after ":" are for local development only.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/codesync}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Database work happens in services, never while a response is being written
spring.jpa.open-in-view=false

# Behind the HTTPS proxy, use the original scheme and host it forwards
server.forward-headers-strategy=framework

# No default on purpose: the backend refuses to start without it
codesync.jwt.secret=${JWT_SECRET:}
# A working session: long enough that a two-hour match never logs a player out halfway
codesync.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Comma-separated list of frontend origins allowed to call the API and open WebSockets
codesync.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# How many programs may run at the same time (each gets 1 CPU and 256 MB)
codesync.execution.max-concurrent=${EXECUTION_MAX_CONCURRENT:2}

# Docker image with the compiler or interpreter for each language
codesync.execution.image.cpp=${CODESYNC_IMAGE_CPP:gcc:14}
codesync.execution.image.python=${CODESYNC_IMAGE_PYTHON:python:3.13-slim}
codesync.execution.image.java=${CODESYNC_IMAGE_JAVA:eclipse-temurin:21-jdk}

# OAuth client id from Google Cloud Console; empty = Google sign-in is off and its button hidden
codesync.google.client-id=${GOOGLE_CLIENT_ID:}

# AI tutor. Without an API key it is switched off and the rest of CodeSync works the same.
# A free key (no card) comes from Google AI Studio: https://aistudio.google.com/apikey
codesync.tutor.gemini.api-key=${GEMINI_API_KEY:}
codesync.tutor.gemini.model=${TUTOR_MODEL:gemini-flash-lite-latest}
codesync.tutor.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
# Hints per user, and for the whole server per day (keep it under the key's free daily quota)
codesync.tutor.limit.per-hour=${TUTOR_LIMIT_PER_HOUR:15}
codesync.tutor.limit.per-day=${TUTOR_LIMIT_PER_DAY:50}
codesync.tutor.limit.server-per-day=${TUTOR_LIMIT_SERVER_PER_DAY:400}
